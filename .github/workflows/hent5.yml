name: hent-5m
on:
  push:
    branches: [hurtig-data]
    paths: [fetch5.py, .github/workflows/hent5.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch5.py
      - run: |
          git config user.name "sktrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin hurtig-data || true
          git add k5
          git commit -m "5m-data rundt NY-åpning" && git push
