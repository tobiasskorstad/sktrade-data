name: hent-15m
on:
  push:
    branches: [hurtig-data]
    paths: [fetch15.py, .github/workflows/hent15.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python fetch15.py
      - run: |
          git config user.name "sktrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k15
          git commit -m "15m-data" && git push
