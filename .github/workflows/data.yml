name: markedsdata

on:
  schedule:
    - cron: "30 1 * * *"   # hver natt 01:30 UTC
  workflow_dispatch:
  push:
    paths:
      - fetch_markets.py
      - .github/workflows/data.yml

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install yfinance
      - run: python fetch_markets.py
      - name: Lagre data
        run: |
          git config user.name "sktrade-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Oppdater markedsdata"
          git push
